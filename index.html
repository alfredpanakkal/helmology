<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1210" />
    <title>The Helmology Series – Helmology</title>
    <meta name="description" content="Helmology is the home of the Helm series: maritime-first tools built by a serving seafarer. Live NAVAREA warnings and a free world port directory." />
    <link rel="canonical" href="https://helmology.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="The Helmology Series" />
    <meta property="og:description" content="Maritime-first tools built by a serving seafarer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helmology.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      // Pre-hydration theme: apply the saved/system theme before first paint
      // so the page never flashes light-then-dark on mobile. Mirrors the
      // ThemeProvider logic in src/components/theme-provider.tsx.
      try {
        var t = localStorage.getItem("helmology-theme") || "system";
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root" data-page="home"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
