<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1210" />
    <title>About – Helmology</title>
    <meta name="description" content="Alfred Panakkal Jose — full-stack developer and serving Third Officer. The story behind the Helm series." />
    <link rel="canonical" href="https://helmology.com/about" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="About Alfred Panakkal Jose" />
    <meta property="og:description" content="Full-stack developer and serving Third Officer, building the Helm series." />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://helmology.com/about" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem("helmology-theme") || "system";
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root" data-page="about"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
