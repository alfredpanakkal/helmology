<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1210" />
    <title>Disclaimer – Helmology</title>
    <meta name="description" content="Maritime safety disclaimer for the Helmology series apps. Situational awareness only; official notices always take precedence." />
    <link rel="canonical" href="https://helmology.com/disclaimer" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem("helmology-theme") || "system";
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root" data-page="disclaimer"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
